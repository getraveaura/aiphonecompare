name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Playwright is unused by the static build; skip its browser download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Public PostHog project token. It is embedded in the browser bundle.
          PUBLIC_POSTHOG_KEY: phc_zZDf6BdaqGMsULwgWG4SHPHoqKiFeWaDqct8d4X7hMPs
          PUBLIC_POSTHOG_HOST: https://us.i.posthog.com

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload IndexNow payload
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: indexnow-payload.json
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on and set the source to GitHub Actions when it is not
          # already enabled, so a new repo does not need a Settings change.
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 10 minutes. A slow Pages update was cancelled while still
          # in updating_pages, which left the previous site live.
          timeout: 1800000

      - name: Checkout IndexNow script
        uses: actions/checkout@v4

      - name: Download IndexNow payload
        uses: actions/download-artifact@v4
        with:
          name: indexnow

      - name: Ping IndexNow
        run: node scripts/indexnow-ping.mjs
